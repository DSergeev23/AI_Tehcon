<text x="1130" y="1678" font-size="22" font-weight="700" fill="#20262d" text-anchor="end">2,9 млн ₽</text>
<text x="1380" y="1678" font-size="24" font-weight="700" fill="#20262d" text-anchor="end">1</text>
