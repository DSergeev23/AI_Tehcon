<text x="135" y="931" font-size="29" font-weight="700" fill="#20262d" text-anchor="start">Что изменилось у прямых конкурентов</text>
<text x="82" y="953" font-size="17" font-weight="700" fill="#687580" text-anchor="start">ПРОДАВЕЦ</text>
<text x="490" y="953" font-size="17" font-weight="700" fill="#687580" text-anchor="start">АССОРТИМЕНТ / ЦЕНА</text>
<text x="1135" y="953" font-size="17" font-weight="700" fill="#687580" text-anchor="start">СИГНАЛ</text>
