<text x="157" y="1954" font-size="22" font-weight="700" fill="#20262d" text-anchor="start">Вернуть в наличие два ходовых светильника</text>
<text x="157" y="1988" font-size="18" font-weight="400" fill="#687580" text-anchor="start">Сверить остатки, срок поставки и потерянные показы.</text>
<rect x="82" y="2025" width="1436" height="88" rx="8" fill="#f7f8f9" stroke="#e0e5e9" stroke-width="2"/>
<text x="103" y="2060" font-size="20" font-weight="700" fill="#b63740" text-anchor="start">02</text>
<text x="157" y="2060" font-size="22" font-weight="700" fill="#20262d" text-anchor="start">Проверить один SKU с креплением к столу</text>
<text x="157" y="2094" font-size="18" font-weight="400" fill="#687580" text-anchor="start">Запросить образец и рассчитать экономику до закупки.</text>
<rect x="82" y="2131" width="1436" height="88" rx="8" fill="#f7f8f9" stroke="#e0e5e9" stroke-width="2"/>
<text x="103" y="2166" font-size="20" font-weight="700" fill="#b63740" text-anchor="start">03</text>
<text x="157" y="2166" font-size="22" font-weight="700" fill="#20262d" text-anchor="start">Следить за ценой сопоставимых моделей</text>
<text x="157" y="2200" font-size="18" font-weight="400" fill="#687580" text-anchor="start">Не менять цену без подтверждения эффекта и маржи.</text>
<text x="54" y="2334" font-size="17" font-weight="400" fill="#687580" text-anchor="start">Метод: сравнение прямого сегмента, карточек и остатков за два периода. Новые SKU требуют отдельной проверки.</text>
