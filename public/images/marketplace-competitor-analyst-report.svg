<text x="1348" y="773" font-size="22" font-weight="700" fill="#b63740" text-anchor="start">−5</text>
<line x1="82" y1="797" x2="1518" y2="797" stroke="#d9dfe3" stroke-width="2"/>
<text x="82" y="835" font-size="18" font-weight="400" fill="#687580" text-anchor="start">Сегмент включает сопоставимые настольные модели Ozon в выбранном ценовом диапазоне.</text>
