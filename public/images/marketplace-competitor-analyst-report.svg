<text x="1380" y="1758" font-size="24" font-weight="700" fill="#20262d" text-anchor="end">2</text>
<line x1="82" y1="1781" x2="1518" y2="1781" stroke="#d9dfe3" stroke-width="2"/>
<text x="82" y="1812" font-size="18" font-weight="400" fill="#687580" text-anchor="start">Выручка формата показывает размер рынка, а не ожидаемые продажи нового SKU.</text>
<rect x="54" y="1862" width="1492" height="440" rx="13" fill="#ffffff" stroke="#cfd6db" stroke-width="2"/>
<text x="82" y="1910" font-size="19" font-weight="700" fill="#b63740" text-anchor="start" letter-spacing="2">04</text>
<text x="135" y="1910" font-size="29" font-weight="700" fill="#20262d" text-anchor="start">Очередь действий на следующую неделю</text>
