<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2380" viewBox="0 0 1600 2380" role="img" aria-labelledby="title description">
<title id="title">Ниша растёт — где бренд теряет долю</title>
<desc id="description">Сравнение продавца настольных светильников с прямыми конкурентами: выручка ниши, доля бренда, активные SKU, изменения ассортимента и приоритетные проверки.</desc>
