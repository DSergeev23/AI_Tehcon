<text x="1130" y="1598" font-size="22" font-weight="700" fill="#20262d" text-anchor="end">3,6 млн ₽</text>
<text x="1380" y="1598" font-size="24" font-weight="700" fill="#b63740" text-anchor="end">0</text>
<line x1="82" y1="1621" x2="1518" y2="1621" stroke="#d9dfe3" stroke-width="2"/>
<text x="82" y="1678" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">Аккумуляторные</text>
