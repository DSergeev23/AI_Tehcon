<text x="135" y="455" font-size="29" font-weight="700" fill="#20262d" text-anchor="start">Рост рынка и движение продавцов</text>
<text x="82" y="478" font-size="17" font-weight="700" fill="#687580" text-anchor="start">ПОКАЗАТЕЛЬ</text>
<text x="680" y="478" font-size="17" font-weight="700" fill="#687580" text-anchor="start">АВГУСТ</text>
<text x="973" y="478" font-size="17" font-weight="700" fill="#687580" text-anchor="start">СЕНТЯБРЬ</text>
<text x="1348" y="478" font-size="17" font-weight="700" fill="#687580" text-anchor="start">ИЗМЕНЕНИЕ</text>
