<text x="78" y="77" font-size="18" font-weight="700" fill="#e6e9ec" text-anchor="start" letter-spacing="2">AI TEHCON / МЕНЕДЖЕР ПО ОТЗЫВАМ</text>
<text x="54" y="138" font-size="47" font-weight="700" fill="#ffffff" text-anchor="start">Отзывы WB: причины, очередь, ответы</text>
<rect x="1190" y="57" width="356" height="50" rx="8" fill="#2a3139" stroke="#67727c" stroke-width="2"/>
<text x="1212" y="90" font-size="17" font-weight="700" fill="#f0f2f4" text-anchor="start">07–13 ОКТЯБРЯ 2026 · WB</text>
<rect x="54" y="207" width="356" height="168" rx="12" fill="#ffffff" stroke="#cfd6db" stroke-width="2"/>
<text x="80" y="250" font-size="18" font-weight="700" fill="#687580" text-anchor="start" letter-spacing="1">ОБРАЩЕНИЯ</text>
<text x="80" y="311" font-size="42" font-weight="700" fill="#171c22" text-anchor="start">64</text>
<text x="80" y="349" font-size="18" font-weight="400" fill="#687580" text-anchor="start">46 отзывов · 18 вопросов</text>
<rect x="430" y="207" width="356" height="168" rx="12" fill="#ffffff" stroke="#cfd6db" stroke-width="2"/>
<text x="456" y="250" font-size="18" font-weight="700" fill="#687580" text-anchor="start" letter-spacing="1">НИЗКИЕ ОЦЕНКИ</text>
<text x="456" y="311" font-size="42" font-weight="700" fill="#171c22" text-anchor="start">11</text>
<text x="456" y="349" font-size="18" font-weight="400" fill="#687580" text-anchor="start">Отзывы с оценкой 1–3</text>
<rect x="806" y="207" width="356" height="168" rx="12" fill="#ffffff" stroke="#cfd6db" stroke-width="2"/>
<text x="832" y="250" font-size="18" font-weight="700" fill="#687580" text-anchor="start" letter-spacing="1">РАЗМЕР И ПОСАДКА</text>
<text x="832" y="311" font-size="42" font-weight="700" fill="#171c22" text-anchor="start">24</text>
<text x="832" y="349" font-size="18" font-weight="400" fill="#687580" text-anchor="start">Самая частая тема</text>
<rect x="1182" y="207" width="364" height="168" rx="12" fill="#fff8f7" stroke="#dfb7b9" stroke-width="2"/>
<text x="1208" y="250" font-size="18" font-weight="700" fill="#9b3039" text-anchor="start" letter-spacing="1">ПЕРЕДАТЬ ЧЕЛОВЕКУ</text>
<text x="1208" y="311" font-size="42" font-weight="700" fill="#b63740" text-anchor="start">12</text>
<text x="1208" y="349" font-size="18" font-weight="400" fill="#687580" text-anchor="start">Качество, спор, доставка</text>
<rect x="54" y="403" width="1492" height="495" rx="13" fill="#ffffff" stroke="#cfd6db" stroke-width="2"/>
<text x="82" y="451" font-size="19" font-weight="700" fill="#b63740" text-anchor="start" letter-spacing="2">01</text>
<text x="135" y="451" font-size="29" font-weight="700" fill="#20262d" text-anchor="start">О чём пишут покупатели</text>
<text x="82" y="508" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">Размер и посадка</text>
<rect x="500" y="481" width="672" height="34" rx="4" fill="#d7e8dc"/>
<text x="1290" y="508" font-size="23" font-weight="700" fill="#20262d" text-anchor="end">24</text>
<text x="1518" y="508" font-size="23" font-weight="700" fill="#687580" text-anchor="end">38%</text>
<text x="82" y="580" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">Ткань и ощущения</text>
<rect x="500" y="553" width="448" height="34" rx="4" fill="#dce7f3"/>
<text x="1290" y="580" font-size="23" font-weight="700" fill="#20262d" text-anchor="end">16</text>
<text x="1518" y="580" font-size="23" font-weight="700" fill="#687580" text-anchor="end">25%</text>
<text x="82" y="652" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">Доставка</text>
<rect x="500" y="625" width="336" height="34" rx="4" fill="#f3e9d2"/>
<text x="1290" y="652" font-size="23" font-weight="700" fill="#20262d" text-anchor="end">12</text>
<text x="1518" y="652" font-size="23" font-weight="700" fill="#687580" text-anchor="end">19%</text>
<text x="82" y="724" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">Уход за вещью</text>
<rect x="500" y="697" width="224" height="34" rx="4" fill="#e8dff0"/>
<text x="1290" y="724" font-size="23" font-weight="700" fill="#20262d" text-anchor="end">8</text>
<text x="1518" y="724" font-size="23" font-weight="700" fill="#687580" text-anchor="end">12%</text>
<text x="82" y="796" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">Прочее</text>
<rect x="500" y="769" width="112" height="34" rx="4" fill="#e8ecef"/>
<text x="1290" y="796" font-size="23" font-weight="700" fill="#20262d" text-anchor="end">4</text>
<text x="1518" y="796" font-size="23" font-weight="700" fill="#687580" text-anchor="end">6%</text>
<text x="82" y="869" font-size="19" font-weight="400" fill="#687580" text-anchor="start">Тема у каждого сообщения одна, поэтому сумма по строкам равна 64.</text>
<rect x="54" y="920" width="1492" height="350" rx="13" fill="#ffffff" stroke="#cfd6db" stroke-width="2"/>
<text x="82" y="968" font-size="19" font-weight="700" fill="#b63740" text-anchor="start" letter-spacing="2">02</text>
<text x="135" y="968" font-size="29" font-weight="700" fill="#20262d" text-anchor="start">Маршрут обработки: ни один ответ не уходит вслепую</text>
<rect x="82" y="1025" width="456" height="185" rx="10" fill="#f1faf4" stroke="#cfe5d7" stroke-width="2"/>
<text x="106" y="1088" font-size="44" font-weight="700" fill="#238456" text-anchor="start">42</text>
<text x="106" y="1132" font-size="17" font-weight="700" fill="#20262d" text-anchor="start">ЧЕРНОВИК К СОГЛАСОВАНИЮ</text>
<text x="106" y="1173" font-size="18" font-weight="400" fill="#687580" text-anchor="start">Есть подтверждённые данные для ответа.</text>
<rect x="572" y="1025" width="456" height="185" rx="10" fill="#fff9eb" stroke="#ecd8a3" stroke-width="2"/>
<text x="596" y="1088" font-size="44" font-weight="700" fill="#966500" text-anchor="start">10</text>
<text x="596" y="1132" font-size="17" font-weight="700" fill="#20262d" text-anchor="start">НУЖНО УТОЧНЕНИЕ</text>
<text x="596" y="1173" font-size="18" font-weight="400" fill="#687580" text-anchor="start">В карточке или заказе не хватает факта.</text>
<rect x="1062" y="1025" width="456" height="185" rx="10" fill="#fbf3f2" stroke="#e2c8c8" stroke-width="2"/>
<text x="1086" y="1088" font-size="44" font-weight="700" fill="#b63740" text-anchor="start">12</text>
<text x="1086" y="1132" font-size="17" font-weight="700" fill="#20262d" text-anchor="start">ЭСКАЛАЦИЯ</text>
<text x="1086" y="1173" font-size="18" font-weight="400" fill="#687580" text-anchor="start">Спор, качество или сложная доставка.</text>
<text x="82" y="1243" font-size="19" font-weight="400" fill="#687580" text-anchor="start">Статусы относятся к подготовке ответа; они не означают, что ответ уже опубликован.</text>
<rect x="54" y="1292" width="1492" height="886" rx="13" fill="#ffffff" stroke="#cfd6db" stroke-width="2"/>
<text x="82" y="1340" font-size="19" font-weight="700" fill="#b63740" text-anchor="start" letter-spacing="2">03</text>
<text x="135" y="1340" font-size="29" font-weight="700" fill="#20262d" text-anchor="start">Три обращения — три разных действия</text>
<rect x="82" y="1395" width="1436" height="225" rx="8" fill="#f7f8f9" stroke="#e0e5e9" stroke-width="2"/>
<text x="105" y="1440" font-size="19" font-weight="700" fill="#238456" text-anchor="start">ВОПРОС · РАЗМЕР</text>
<text x="105" y="1481" font-size="23" font-weight="700" fill="#20262d" text-anchor="start">«Подойдёт размер M на обхват бёдер 98 см?»</text>
<text x="105" y="1525" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">Черновик: «По таблице M рассчитан на обхват бёдер 94–100 см.</text>
<text x="105" y="1558" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">Если нужна свободная посадка, уточните и обхват талии — подскажем точнее.»</text>
<text x="105" y="1593" font-size="18" font-weight="400" fill="#687580" text-anchor="start">Источник: утверждённая размерная таблица · статус: к согласованию</text>
<rect x="82" y="1638" width="1436" height="225" rx="8" fill="#f7f8f9" stroke="#e0e5e9" stroke-width="2"/>
<text x="105" y="1683" font-size="19" font-weight="700" fill="#238456" text-anchor="start">ОТЗЫВ 5★ · ТКАНЬ</text>
<text x="105" y="1724" font-size="23" font-weight="700" fill="#20262d" text-anchor="start">«Мягкая ткань, удобно бегать, после тренировки быстро высохли.»</text>
<text x="105" y="1768" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">Черновик: «Спасибо, что рассказали об опыте на тренировке.</text>
<text x="105" y="1801" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">Рады, что вам подошли посадка и ткань. Приятных пробежек!»</text>
<text x="105" y="1836" font-size="18" font-weight="400" fill="#687580" text-anchor="start">Источник: текст отзыва · статус: к согласованию</text>
<rect x="82" y="1881" width="1436" height="255" rx="8" fill="#fff6f4" stroke="#e5c9c7" stroke-width="2"/>
<text x="105" y="1926" font-size="19" font-weight="700" fill="#b63740" text-anchor="start">ОТЗЫВ 2★ · КАЧЕСТВО</text>
<text x="105" y="1967" font-size="23" font-weight="700" fill="#20262d" text-anchor="start">«После первой стирки разошёлся шов на левом боку.»</text>
<text x="105" y="2011" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">Черновик: «Спасибо, что сообщили. Нам жаль, что возникла проблема.</text>
<text x="105" y="2044" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">Пожалуйста, напишите в чат заказа и приложите фото: проверим изделие.»</text>
<text x="105" y="2100" font-size="18" font-weight="700" fill="#b63740" text-anchor="start">Маршрут: специалист проверяет случай до отправки ответа и передаёт в качество.</text>
<rect x="54" y="2200" width="1492" height="305" rx="13" fill="#ffffff" stroke="#cfd6db" stroke-width="2"/>
<text x="82" y="2248" font-size="19" font-weight="700" fill="#b63740" text-anchor="start" letter-spacing="2">04</text>
<text x="135" y="2248" font-size="29" font-weight="700" fill="#20262d" text-anchor="start">Что делать с повторяющимися причинами</text>
<text x="82" y="2294" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">1. Размер: проверить таблицу и уточнить диапазон по талии и бёдрам.</text>
<text x="82" y="2340" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">2. Уход: вынести правила стирки в карточку и инструкцию.</text>
<text x="82" y="2386" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">3. Швы: собрать фото обращений и проверить партию у качества.</text>
<text x="82" y="2468" font-size="19" font-weight="400" fill="#687580" text-anchor="start">Оценка эффекта — после правок: частота вопросов, оценки и причины возвратов.</text>
<text x="54" y="2533" font-size="18" font-weight="400" fill="#687580" text-anchor="start">Источник: отзывы, вопросы, карточка и размерная таблица. Ответы публикуются после согласования.</text>
</g>
