<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560" role="img" aria-labelledby="title description">
<title id="title">Отзывы WB: причины, очередь, ответы</title>
<desc id="description">Недельная сводка для спортивных леггинсов: 46 отзывов, 18 вопросов, темы обращений, маршруты обработки, черновики персональных ответов и задачи для команды.</desc>
<g font-family="Arial, sans-serif">
<rect x="0" y="0" width="1600" height="2560" rx="12" fill="#eceff1"/>
<rect x="20" y="20" width="1560" height="2520" rx="20" fill="#f7f8f9" stroke="#d5dbe0" stroke-width="2"/>
