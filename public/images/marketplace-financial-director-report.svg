<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title description">
  <title id="title">P&amp;L маркетплейсов за сентябрь 2026 года</title>
  <desc id="description">План и факт выручки, расходов и прибыли WB и Ozon. Фактическая выручка 2 300 000 рублей, ДРР 11 процентов, операционная прибыль 75 000 рублей. Отклонение прибыли от плана минус 250 000 рублей.</desc>
