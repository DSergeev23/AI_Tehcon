    <text x="82" y="1100">Операционная прибыль</text><text x="516" y="1100" text-anchor="end">325 000</text><text x="726" y="1100" text-anchor="end">75 000</text><text x="924" y="1100" text-anchor="end" fill="#b63740">−250 000</text>
  </g>
  <line x1="82" y1="1051" x2="924" y2="1051" stroke="#cbd2d8" stroke-width="2"/>

