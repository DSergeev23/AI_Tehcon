<text x="159" y="2222" font-size="21" font-weight="700" fill="#20262d" text-anchor="start">После приёмки</text>
<text x="452" y="2222" font-size="19" font-weight="400" fill="#20262d" text-anchor="start">Сверить фактические остатки с целью 21 день покрытия.</text>
<text x="54" y="2373" font-size="17" font-weight="400" fill="#687580" text-anchor="start">Метод: запас к приёмке = доступный остаток + поступления + перемещение − продажи за 7 дней.</text>
