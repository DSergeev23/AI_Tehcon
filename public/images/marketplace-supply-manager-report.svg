<text x="159" y="2034" font-size="21" font-weight="700" fill="#20262d" text-anchor="start">Поставщик</text>
<text x="452" y="2034" font-size="19" font-weight="400" fill="#20262d" text-anchor="start">Наличие 712 комплектов и возможность разделить отгрузку.</text>
<rect x="82" y="2097" width="1436" height="77" rx="8" fill="#f7f8f9" stroke="#e0e5e9" stroke-width="2"/>
<text x="103" y="2128" font-size="19" font-weight="700" fill="#b63740" text-anchor="start">03</text>
<text x="159" y="2128" font-size="21" font-weight="700" fill="#20262d" text-anchor="start">Менеджер</text>
<text x="452" y="2128" font-size="19" font-weight="400" fill="#20262d" text-anchor="start">Фактические продажи, резервы и складские ограничения Ozon.</text>
<rect x="82" y="2191" width="1436" height="77" rx="8" fill="#f7f8f9" stroke="#e0e5e9" stroke-width="2"/>
