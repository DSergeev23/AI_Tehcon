<text x="824" y="1655" font-size="20" font-weight="400" fill="#20262d" text-anchor="start">К дню 7: Центр 59 шт., Урал 4 шт.</text>
<text x="824" y="1687" font-size="20" font-weight="400" fill="#20262d" text-anchor="start">Товар остаётся в сети, заказ не растёт.</text>
