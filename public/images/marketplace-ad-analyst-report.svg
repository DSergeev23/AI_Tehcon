<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2430" viewBox="0 0 1600 2430" role="img" aria-labelledby="title description">
<title id="title">Анализ рекламы зоотоваров Ozon: CPC против CPA</title>
<desc id="description">Отчёт по четырём SKU: 286 заказов, выручка 535 тысяч рублей, ДРР 14,2 процента при цели 12 процентов, сравнение CPC и CPA, допустимый расход и план переноса 15 тысяч рублей.</desc>
