<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2380" viewBox="0 0 1600 2380" role="img" aria-labelledby="title description">
<title id="title">В какую поднишу входить до закупки</title>
<desc id="description">Предзакупочный отчёт по фитнес-роликам: спрос, конкуренция, доля лидеров, юнит-экономика и предельная закупочная цена двух моделей.</desc>
<g font-family="Arial, sans-serif">
<rect x="0" y="0" width="1600" height="2380" rx="12" fill="#edf0f2"/>
<rect x="20" y="20" width="1560" height="2340" rx="20" fill="#f8f9fa" stroke="#d5dbe0" stroke-width="2"/>
<rect x="20" y="20" width="1560" height="165" rx="20" fill="#171c22"/>
<rect x="20" y="145" width="1560" height="40" rx="12" fill="#171c22"/>
<rect x="54" y="54" width="7" height="27" rx="3" fill="#c8444c"/>
<text x="78" y="77" font-size="18" font-weight="700" fill="#e6e9ec" text-anchor="start" letter-spacing="2">AI TEHCON / КАТЕГОРИЙНЫЙ МЕНЕДЖЕР</text>
<text x="54" y="138" font-size="46" font-weight="700" fill="#ffffff" text-anchor="start">В какую поднишу входить до закупки</text>
<rect x="1195" y="56" width="350" height="50" rx="8" fill="#2a3139" stroke="#67727c" stroke-width="2"/>
<text x="1212" y="88" font-size="17" font-weight="700" fill="#f0f2f4" text-anchor="start">30 ДНЕЙ · OZON</text>
<rect x="54" y="207" width="356" height="170" rx="12" fill="#ffffff" stroke="#cfd6db" stroke-width="2"/>
<text x="80" y="250" font-size="18" font-weight="700" fill="#687580" text-anchor="start" letter-spacing="1">ПРОДАЖИ НИШИ</text>
<text x="80" y="312" font-size="43" font-weight="700" fill="#171c22" text-anchor="start">9,6 млн ₽</text>
<text x="80" y="350" font-size="17" font-weight="400" fill="#687580" text-anchor="start">за 30 дней · две подниши</text>
<rect x="430" y="207" width="356" height="170" rx="12" fill="#ffffff" stroke="#cfd6db" stroke-width="2"/>
<text x="456" y="250" font-size="18" font-weight="700" fill="#687580" text-anchor="start" letter-spacing="1">ПРОДАНО</text>
<text x="456" y="312" font-size="43" font-weight="700" fill="#171c22" text-anchor="start">4 000 шт.</text>
<text x="456" y="350" font-size="17" font-weight="400" fill="#687580" text-anchor="start">средняя цена 2 400 ₽</text>
<rect x="806" y="207" width="356" height="170" rx="12" fill="#ffffff" stroke="#cfd6db" stroke-width="2"/>
<text x="832" y="250" font-size="18" font-weight="700" fill="#687580" text-anchor="start" letter-spacing="1">КАРТОЧКИ С ПРОДАЖАМИ</text>
<text x="832" y="312" font-size="43" font-weight="700" fill="#171c22" text-anchor="start">390 / 620</text>
<text x="832" y="350" font-size="17" font-weight="400" fill="#687580" text-anchor="start">63% выборки</text>
<rect x="1182" y="207" width="356" height="170" rx="12" fill="#fff8f7" stroke="#dfb7b9" stroke-width="2"/>
<text x="1208" y="250" font-size="18" font-weight="700" fill="#a6323c" text-anchor="start" letter-spacing="1">ЦЕЛЬ ПО МАРЖЕ</text>
<text x="1208" y="312" font-size="43" font-weight="700" fill="#b63740" text-anchor="start">25%</text>
<text x="1208" y="350" font-size="17" font-weight="400" fill="#687580" text-anchor="start">вклад после переменных затрат</text>
<rect x="54" y="407" width="1492" height="478" rx="13" fill="#ffffff" stroke="#cfd6db" stroke-width="2"/>
<text x="82" y="455" font-size="19" font-weight="700" fill="#b63740" text-anchor="start" letter-spacing="2">01</text>
<text x="135" y="455" font-size="29" font-weight="700" fill="#20262d" text-anchor="start">Спрос и барьер входа по двум типам</text>
<text x="82" y="477" font-size="17" font-weight="700" fill="#687580" text-anchor="start">ПОДНИША</text>
<text x="510" y="477" font-size="17" font-weight="700" fill="#687580" text-anchor="start">ВЫРУЧКА</text>
<text x="740" y="477" font-size="17" font-weight="700" fill="#687580" text-anchor="start">ШТ.</text>
<text x="900" y="477" font-size="17" font-weight="700" fill="#687580" text-anchor="start">СР. ЦЕНА</text>
<text x="1120" y="477" font-size="17" font-weight="700" fill="#687580" text-anchor="start">КАРТОЧКИ</text>
<text x="1360" y="477" font-size="17" font-weight="700" fill="#687580" text-anchor="start">ТОП-3</text>
<line x1="82" y1="501" x2="1518" y2="501" stroke="#d9dfe3" stroke-width="2"/>
<text x="82" y="563" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">Гладкие ролики</text>
<text x="510" y="563" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">5,4 млн ₽</text>
<text x="740" y="563" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">2 400</text>
<text x="900" y="563" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">2 250 ₽</text>
<text x="1120" y="563" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">245 / 380</text>
<text x="1360" y="563" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">38%</text>
<line x1="82" y1="590" x2="1518" y2="590" stroke="#d9dfe3" stroke-width="2"/>
<text x="82" y="646" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">Рельефные ролики</text>
<text x="510" y="646" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">4,2 млн ₽</text>
<text x="740" y="646" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">1 600</text>
<text x="900" y="646" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">2 625 ₽</text>
<text x="1120" y="646" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">145 / 240</text>
<text x="1360" y="646" font-size="21" font-weight="700" fill="#b63740" text-anchor="start">64%</text>
<line x1="82" y1="673" x2="1518" y2="673" stroke="#d9dfe3" stroke-width="2"/>
<text x="82" y="729" font-size="21" font-weight="700" fill="#20262d" text-anchor="start">Вся ниша</text>
<text x="510" y="729" font-size="21" font-weight="700" fill="#20262d" text-anchor="start">9,6 млн ₽</text>
<text x="740" y="729" font-size="21" font-weight="700" fill="#20262d" text-anchor="start">4 000</text>
<text x="900" y="729" font-size="21" font-weight="700" fill="#20262d" text-anchor="start">2 400 ₽</text>
<text x="1120" y="729" font-size="21" font-weight="700" fill="#20262d" text-anchor="start">390 / 620</text>
<text x="1360" y="729" font-size="21" font-weight="700" fill="#20262d" text-anchor="start">—</text>
<line x1="82" y1="756" x2="1518" y2="756" stroke="#d9dfe3" stroke-width="2"/>
<text x="82" y="818" font-size="18" font-weight="400" fill="#687580" text-anchor="start">У гладких роликов выше объём, меньше концентрация лидеров и больше карточек с продажами.</text>
<text x="82" y="848" font-size="18" font-weight="400" fill="#687580" text-anchor="start">Выборка очищена от дублей и соседних товаров; её состав нужно подтвердить перед закупкой.</text>
<rect x="54" y="909" width="1492" height="627" rx="13" fill="#ffffff" stroke="#cfd6db" stroke-width="2"/>
<text x="82" y="957" font-size="19" font-weight="700" fill="#b63740" text-anchor="start" letter-spacing="2">02</text>
<text x="135" y="957" font-size="29" font-weight="700" fill="#20262d" text-anchor="start">Экономика одной проданной единицы</text>
<text x="82" y="980" font-size="17" font-weight="700" fill="#687580" text-anchor="start">СТАТЬЯ</text>
<text x="885" y="980" font-size="17" font-weight="700" fill="#687580" text-anchor="start">ГЛАДКИЙ</text>
<text x="1235" y="980" font-size="17" font-weight="700" fill="#687580" text-anchor="start">РЕЛЬЕФНЫЙ</text>
<line x1="82" y1="1004" x2="1518" y2="1004" stroke="#d9dfe3" stroke-width="2"/>
<text x="82" y="1054" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">Цена продажи</text>
<text x="885" y="1054" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">2 290 ₽</text>
<text x="1235" y="1054" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">2 690 ₽</text>
<line x1="82" y1="1076" x2="1518" y2="1076" stroke="#d9dfe3" stroke-width="2"/>
<text x="82" y="1119" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">Закупка</text>
<text x="885" y="1119" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">−620 ₽</text>
<text x="1235" y="1119" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">−980 ₽</text>
<line x1="82" y1="1141" x2="1518" y2="1141" stroke="#d9dfe3" stroke-width="2"/>
<text x="82" y="1184" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">Комиссия площадки</text>
<text x="885" y="1184" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">−389 ₽</text>
<text x="1235" y="1184" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">−457 ₽</text>
<line x1="82" y1="1206" x2="1518" y2="1206" stroke="#d9dfe3" stroke-width="2"/>
<text x="82" y="1249" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">Логистика</text>
<text x="885" y="1249" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">−190 ₽</text>
<text x="1235" y="1249" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">−230 ₽</text>
<line x1="82" y1="1271" x2="1518" y2="1271" stroke="#d9dfe3" stroke-width="2"/>
<text x="82" y="1314" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">Реклама на заказ</text>
<text x="885" y="1314" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">−250 ₽</text>
<text x="1235" y="1314" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">−350 ₽</text>
<line x1="82" y1="1336" x2="1518" y2="1336" stroke="#d9dfe3" stroke-width="2"/>
<text x="82" y="1379" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">Возвраты и упаковка</text>
<text x="885" y="1379" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">−140 ₽</text>
<text x="1235" y="1379" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">−160 ₽</text>
<line x1="82" y1="1401" x2="1518" y2="1401" stroke="#d9dfe3" stroke-width="2"/>
<text x="82" y="1444" font-size="21" font-weight="700" fill="#20262d" text-anchor="start">Вклад с единицы</text>
<text x="885" y="1444" font-size="22" font-weight="700" fill="#238456" text-anchor="start">701 ₽</text>
<text x="1235" y="1444" font-size="22" font-weight="700" fill="#b63740" text-anchor="start">513 ₽</text>
<line x1="82" y1="1466" x2="1518" y2="1466" stroke="#d9dfe3" stroke-width="2"/>
<text x="82" y="1510" font-size="18" font-weight="400" fill="#687580" text-anchor="start">Комиссия округлена до рубля; рекламные расходы заданы на оплаченный заказ.</text>
<rect x="54" y="1559" width="1492" height="376" rx="13" fill="#ffffff" stroke="#cfd6db" stroke-width="2"/>
<text x="82" y="1607" font-size="19" font-weight="700" fill="#b63740" text-anchor="start" letter-spacing="2">03</text>
<text x="135" y="1607" font-size="29" font-weight="700" fill="#20262d" text-anchor="start">Маржа и потолок закупочной цены</text>
<rect x="82" y="1640" width="691" height="220" rx="10" fill="#f1faf4" stroke="#cfe5d7" stroke-width="2"/>
<text x="108" y="1688" font-size="18" font-weight="700" fill="#238456" text-anchor="start" letter-spacing="1">ГЛАДКИЙ РОЛИК</text>
<text x="108" y="1758" font-size="55" font-weight="700" fill="#238456" text-anchor="start">30,6%</text>
<text x="108" y="1812" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">Маржа выше цели · закупка 620 ₽</text>
<rect x="799" y="1640" width="719" height="220" rx="10" fill="#fff6f4" stroke="#e5c9c7" stroke-width="2"/>
<text x="825" y="1688" font-size="18" font-weight="700" fill="#b63740" text-anchor="start" letter-spacing="1">РЕЛЬЕФНЫЙ РОЛИК</text>
<text x="825" y="1758" font-size="55" font-weight="700" fill="#b63740" text-anchor="start">19,1%</text>
<text x="825" y="1812" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">Ниже цели · закупка 980 ₽</text>
<text x="82" y="1908" font-size="21" font-weight="700" fill="#20262d" text-anchor="start">При цели 25%: потолок закупки ≈749 ₽ для гладкого и ≈821 ₽ для рельефного.</text>
<rect x="54" y="1959" width="1492" height="342" rx="13" fill="#ffffff" stroke="#cfd6db" stroke-width="2"/>
<text x="82" y="2007" font-size="19" font-weight="700" fill="#b63740" text-anchor="start" letter-spacing="2">04</text>
<text x="135" y="2007" font-size="29" font-weight="700" fill="#20262d" text-anchor="start">Решение перед первой партией</text>
<text x="82" y="2038" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">1. Проверить образец гладкого ролика и условия поставщика.</text>
<text x="82" y="2093" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">2. Пилот: 120 шт. × 620 ₽ = 74 400 ₽ закупки; спрос на новый SKU не гарантирован.</text>
<text x="82" y="2148" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">3. Рельефную модель отложить или снизить закупку до уровня целевой маржи.</text>
<text x="82" y="2203" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">4. Перед оплатой обновить комиссии, логистику и цену продажи.</text>
<text x="54" y="2334" font-size="17" font-weight="400" fill="#687580" text-anchor="start">Основа расчёта: выборка Ozon за 30 дней и предложения поставщика. Решение подтверждает менеджер.</text>
</g>
</svg>
