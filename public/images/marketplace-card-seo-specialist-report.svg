  <text x="1008" y="498" class="small" fill="#697681">СЕЙЧАС</text>
  <text x="1008" y="533" class="body" fill="#2a3037">Набор банок для кухни 6 шт</text>
  <line x1="1008" y1="558" x2="1516" y2="558" stroke="#e0e5e9"/>
  <text x="1008" y="601" class="small" fill="#238456">ПРЕДЛОЖЕНИЕ</text>
  <text x="1008" y="636" class="bold" fill="#20262d">Контейнеры для круп пластиковые,</text>
  <text x="1008" y="670" class="bold" fill="#20262d">набор 6 шт, 1 л, с крышками</text>
  <rect x="978" y="718" width="568" height="325" rx="13" fill="#fff8e6" stroke="#e8d6a4" stroke-width="2"/>
  <text x="1008" y="767" class="section" fill="#20262d">Основа описания</text>
  <text x="1008" y="816" class="body" fill="#2a3037">Набор из шести пластиковых</text>
  <text x="1008" y="851" class="body" fill="#2a3037">контейнеров объёмом 1 л каждый.</text>
  <text x="1008" y="886" class="body" fill="#2a3037">Подходят для хранения круп</text>
  <text x="1008" y="921" class="body" fill="#2a3037">и других сыпучих продуктов.</text>
  <text x="1008" y="966" class="small" fill="#66727e">Крышки и комплектацию подтвердить</text>
  <text x="1008" y="997" class="small" fill="#66727e">по карточке поставщика перед публикацией.</text>

  <rect x="54" y="1063" width="1492" height="230" rx="13" fill="#ffffff" stroke="#cfd6db" stroke-width="2"/>
  <text x="82" y="1113" class="section" fill="#20262d">Редакционный контроль и следующая проверка</text>
  <text x="82" y="1160" class="body" fill="#2a3037">Сверить материал, объём и крышки → заполнить характеристики → утвердить заголовок и описание.</text>
  <text x="82" y="1207" class="body" fill="#2a3037">После индексации сравнить видимость, клики и заказы по целевым запросам с прошлым периодом.</text>
  <text x="82" y="1250" class="small mono" fill="#66727e">Основной запрос: 30 000 → 34 200 за соседние 30 дней (+14%). Сезонный пик по двум срезам не подтверждён.</text>
  <text x="54" y="1322" class="small" fill="#66727e">Высокая частотность не делает запрос релевантным. Текст опирается на свойства товара и требует утверждения перед публикацией.</text>
</svg>
