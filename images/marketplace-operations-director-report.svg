<text x="82" y="1266" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">Рекламные расходы</text>
<text x="570" y="1266" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">SKU / кампания / 21.10</text>
<text x="1080" y="1266" font-size="21" font-weight="700" fill="#20262d" text-anchor="start">Аналитик рекламы</text>
<line x1="82" y1="1291" x2="1518" y2="1291" stroke="#d9dfe3" stroke-width="2"/>
<text x="82" y="1348" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">Отзывы и вопросы</text>
<text x="570" y="1348" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">SKU / карточка / 21.10</text>
<text x="1080" y="1348" font-size="21" font-weight="700" fill="#20262d" text-anchor="start">Менеджер по отзывам</text>
<line x1="82" y1="1373" x2="1518" y2="1373" stroke="#d9dfe3" stroke-width="2"/>
<rect x="82" y="1405" width="1436" height="39" rx="6" fill="#fff4e0"/>
<text x="102" y="1432" font-size="18" font-weight="700" fill="#966500" text-anchor="start">Финансы: источник за 21.10 отсутствует → показатель прибыли закрыт до обновления.</text>
<rect x="54" y="1489" width="1492" height="442" rx="13" fill="#ffffff" stroke="#cfd6db" stroke-width="2"/>
<text x="82" y="1537" font-size="19" font-weight="700" fill="#b63740" text-anchor="start" letter-spacing="2">03</text>
<text x="135" y="1537" font-size="29" font-weight="700" fill="#20262d" text-anchor="start">Общий обзор из готовых источников</text>
<rect x="82" y="1575" width="320" height="180" rx="9" fill="#f7f8f9" stroke="#dce2e6" stroke-width="2"/>
<text x="104" y="1620" font-size="17" font-weight="700" fill="#687580" text-anchor="start" letter-spacing="1">ЗАКАЗЫ</text>
<text x="104" y="1687" font-size="35" font-weight="700" fill="#20262d" text-anchor="start">186</text>
<text x="104" y="1728" font-size="18" font-weight="400" fill="#687580" text-anchor="start">за 21 октября</text>
<rect x="454" y="1575" width="320" height="180" rx="9" fill="#f7f8f9" stroke="#dce2e6" stroke-width="2"/>
<text x="476" y="1620" font-size="17" font-weight="700" fill="#687580" text-anchor="start" letter-spacing="1">ПРОДАЖИ</text>
<text x="476" y="1687" font-size="27" font-weight="700" fill="#20262d" text-anchor="start">351 540 ₽</text>
<text x="476" y="1728" font-size="18" font-weight="400" fill="#687580" text-anchor="start">186 × 1 890 ₽</text>
<rect x="826" y="1575" width="320" height="180" rx="9" fill="#f7f8f9" stroke="#dce2e6" stroke-width="2"/>
<text x="848" y="1620" font-size="17" font-weight="700" fill="#687580" text-anchor="start" letter-spacing="1">РЕКЛАМА</text>
<text x="848" y="1687" font-size="27" font-weight="700" fill="#20262d" text-anchor="start">18 600 ₽</text>
<text x="848" y="1728" font-size="18" font-weight="400" fill="#687580" text-anchor="start">расходы за день</text>
<rect x="1198" y="1575" width="320" height="180" rx="9" fill="#f7f8f9" stroke="#dce2e6" stroke-width="2"/>
<text x="1220" y="1620" font-size="17" font-weight="700" fill="#687580" text-anchor="start" letter-spacing="1">ОТЗЫВЫ</text>
<text x="1220" y="1687" font-size="35" font-weight="700" fill="#20262d" text-anchor="start">24</text>
<text x="1220" y="1728" font-size="18" font-weight="400" fill="#687580" text-anchor="start">новых сообщения</text>
<rect x="82" y="1782" width="1436" height="111" rx="9" fill="#fff6f4" stroke="#e5c9c7" stroke-width="2"/>
<text x="108" y="1828" font-size="19" font-weight="700" fill="#b63740" text-anchor="start">ФИНАНСОВЫЙ РЕЗУЛЬТАТ: ОЖИДАЕТ ИСТОЧНИК</text>
<text x="108" y="1870" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">Нет файла за 21.10 — прибыль не подменяется данными за 20.10 или оценкой.</text>
<rect x="54" y="1955" width="1492" height="389" rx="13" fill="#ffffff" stroke="#cfd6db" stroke-width="2"/>
<text x="82" y="2003" font-size="19" font-weight="700" fill="#b63740" text-anchor="start" letter-spacing="2">04</text>
<text x="135" y="2003" font-size="29" font-weight="700" fill="#20262d" text-anchor="start">Задержка обмена и следующий шаг</text>
<rect x="82" y="2034" width="1436" height="113" rx="9" fill="#fff9eb" stroke="#ecd8a3" stroke-width="2"/>
<text x="107" y="2079" font-size="20" font-weight="700" fill="#966500" text-anchor="start">08:00 · ФИНАНСОВАЯ СВЕРКА</text>
<text x="107" y="2122" font-size="20" font-weight="400" fill="#20262d" text-anchor="start">Причина: файл площадки за выбранный день не получен. Владелец процесса — финансы.</text>
<text x="82" y="2202" font-size="19" font-weight="400" fill="#20262d" text-anchor="start">До 10:30 проверить появление файла и повторить сверку за 21 октября.</text>
<text x="82" y="2248" font-size="19" font-weight="400" fill="#20262d" text-anchor="start">После обновления выпустить полную версию обзора с тем же периодом и SKU.</text>
<text x="82" y="2294" font-size="19" font-weight="400" fill="#20262d" text-anchor="start">Если файл задержится, оставить показатель закрытым и сообщить руководителю.</text>
<text x="54" y="2374" font-size="17" font-weight="400" fill="#687580" text-anchor="start">Правило: каждый показатель содержит источник и период; неполный обзор виден как неполный.</text>
</g>
