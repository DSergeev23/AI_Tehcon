<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2420" viewBox="0 0 1600 2420" role="img" aria-labelledby="title description">
<title id="title">Магазин на одной панели управления</title>
<desc id="description">Утренний обзор магазина велоаксессуаров: шесть процессов по расписанию, свежесть пяти источников, обмен данными между агентами и неполная финансовая сверка.</desc>
<g font-family="Arial, sans-serif">
<rect x="0" y="0" width="1600" height="2420" rx="12" fill="#edf0f2"/>
<rect x="20" y="20" width="1560" height="2380" rx="20" fill="#f8f9fa" stroke="#d5dbe0" stroke-width="2"/>
