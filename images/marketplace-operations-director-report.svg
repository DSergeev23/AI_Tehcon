<text x="78" y="77" font-size="18" font-weight="700" fill="#e6e9ec" text-anchor="start" letter-spacing="2">AI TEHCON / ОПЕРАЦИОННЫЙ ДИРЕКТОР</text>
<text x="54" y="138" font-size="44" font-weight="700" fill="#ffffff" text-anchor="start">Магазин на одной панели управления</text>
