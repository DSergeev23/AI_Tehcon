<text x="82" y="840" font-size="22" font-weight="700" fill="#20262d" text-anchor="start">08:00</text>
<text x="270" y="840" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">Финансовая сверка</text>
<text x="830" y="840" font-size="20" font-weight="400" fill="#b63740" text-anchor="start">файл за 21.10 не получен</text>
<text x="1290" y="840" font-size="17" font-weight="700" fill="#b63740" text-anchor="start">ОЖИДАЕТ</text>
<line x1="82" y1="865" x2="1518" y2="865" stroke="#d9dfe3" stroke-width="2"/>
<text x="82" y="912" font-size="22" font-weight="700" fill="#20262d" text-anchor="start">09:00</text>
<text x="270" y="912" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">Общий обзор</text>
<text x="830" y="912" font-size="20" font-weight="400" fill="#20262d" text-anchor="start">4 из 5 источников</text>
<text x="1290" y="912" font-size="17" font-weight="700" fill="#966500" text-anchor="start">ЧАСТИЧНО</text>
<line x1="82" y1="937" x2="1518" y2="937" stroke="#d9dfe3" stroke-width="2"/>
<text x="82" y="984" font-size="18" font-weight="400" fill="#687580" text-anchor="start">Период продаж, рекламы, остатков и отзывов — 21 октября; финансовый файл пока только за 20 октября.</text>
<rect x="54" y="1037" width="1492" height="427" rx="13" fill="#ffffff" stroke="#cfd6db" stroke-width="2"/>
<text x="82" y="1085" font-size="19" font-weight="700" fill="#b63740" text-anchor="start" letter-spacing="2">02</text>
<text x="135" y="1085" font-size="29" font-weight="700" fill="#20262d" text-anchor="start">Обмен данными: один период и один SKU</text>
<text x="82" y="1108" font-size="17" font-weight="700" fill="#687580" text-anchor="start">ИСТОЧНИК</text>
<text x="570" y="1108" font-size="17" font-weight="700" fill="#687580" text-anchor="start">ПЕРЕДАЁТ</text>
<text x="1080" y="1108" font-size="17" font-weight="700" fill="#687580" text-anchor="start">ПОЛУЧАТЕЛЬ</text>
