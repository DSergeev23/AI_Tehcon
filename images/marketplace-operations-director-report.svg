<rect x="806" y="207" width="356" height="170" rx="12" fill="#ffffff" stroke="#cfd6db" stroke-width="2"/>
<text x="832" y="250" font-size="18" font-weight="700" fill="#687580" text-anchor="start" letter-spacing="1">ЗАКАЗЫ</text>
<text x="832" y="312" font-size="43" font-weight="700" fill="#171c22" text-anchor="start">186</text>
<text x="832" y="350" font-size="17" font-weight="400" fill="#687580" text-anchor="start">WB + Ozon за 21 октября</text>
<rect x="1182" y="207" width="356" height="170" rx="12" fill="#fff8f7" stroke="#dfb7b9" stroke-width="2"/>
<text x="1208" y="250" font-size="18" font-weight="700" fill="#a6323c" text-anchor="start" letter-spacing="1">ПРИБЫЛЬ</text>
<text x="1208" y="312" font-size="43" font-weight="700" fill="#b63740" text-anchor="start">—</text>
<text x="1208" y="350" font-size="17" font-weight="400" fill="#687580" text-anchor="start">не считаем по старому файлу</text>
<rect x="54" y="407" width="1492" height="605" rx="13" fill="#ffffff" stroke="#cfd6db" stroke-width="2"/>
<text x="82" y="455" font-size="19" font-weight="700" fill="#b63740" text-anchor="start" letter-spacing="2">01</text>
<text x="135" y="455" font-size="29" font-weight="700" fill="#20262d" text-anchor="start">Расписание агентов и состояние запусков</text>
<text x="82" y="478" font-size="17" font-weight="700" fill="#687580" text-anchor="start">ВРЕМЯ</text>
<text x="270" y="478" font-size="17" font-weight="700" fill="#687580" text-anchor="start">ПРОЦЕСС</text>
<text x="830" y="478" font-size="17" font-weight="700" fill="#687580" text-anchor="start">РЕЗУЛЬТАТ</text>
<text x="1290" y="478" font-size="17" font-weight="700" fill="#687580" text-anchor="start">СТАТУС</text>
<line x1="82" y1="502" x2="1518" y2="502" stroke="#d9dfe3" stroke-width="2"/>
<text x="82" y="552" font-size="22" font-weight="700" fill="#20262d" text-anchor="start">06:30</text>
<text x="270" y="552" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">Продажи WB + Ozon</text>
<text x="830" y="552" font-size="20" font-weight="400" fill="#20262d" text-anchor="start">186 заказов</text>
<text x="1290" y="552" font-size="17" font-weight="700" fill="#238456" text-anchor="start">ГОТОВО</text>
<line x1="82" y1="577" x2="1518" y2="577" stroke="#d9dfe3" stroke-width="2"/>
<text x="82" y="624" font-size="22" font-weight="700" fill="#20262d" text-anchor="start">06:45</text>
<text x="270" y="624" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">Доступные остатки</text>
<text x="830" y="624" font-size="20" font-weight="400" fill="#20262d" text-anchor="start">12 SKU · 1 240 шт.</text>
<text x="1290" y="624" font-size="17" font-weight="700" fill="#238456" text-anchor="start">ГОТОВО</text>
<line x1="82" y1="649" x2="1518" y2="649" stroke="#d9dfe3" stroke-width="2"/>
<text x="82" y="696" font-size="22" font-weight="700" fill="#20262d" text-anchor="start">07:00</text>
<text x="270" y="696" font-size="21" font-weight="400" fill="#20262d" text-anchor="start">Рекламные данные</text>
<text x="830" y="696" font-size="20" font-weight="400" fill="#20262d" text-anchor="start">18 600 ₽ расхода</text>
<text x="1290" y="696" font-size="17" font-weight="700" fill="#238456" text-anchor="start">ГОТОВО</text>
