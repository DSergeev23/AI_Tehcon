<text x="82" y="451" font-size="19" font-weight="700" fill="#b63740" text-anchor="start" letter-spacing="2">01</text>
<text x="135" y="451" font-size="29" font-weight="700" fill="#20262d" text-anchor="start">Паспорт SKU — единственный источник характеристик</text>
<rect x="82" y="503" width="696" height="56" rx="6" fill="#f7f8f9" stroke="#e0e5e9" stroke-width="2"/>
