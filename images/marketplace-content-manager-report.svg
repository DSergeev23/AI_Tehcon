<text x="1518" y="1298" font-size="22" font-weight="700" fill="#238456" text-anchor="end">0,8 кг</text>
<line x1="82" y1="1314" x2="1518" y2="1314" stroke="#e0e5e9" stroke-width="1"/>
<text x="82" y="1353" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">Габариты</text>
<text x="839" y="1353" font-size="22" font-weight="400" fill="#b63740" text-anchor="start">—</text>
<text x="1518" y="1353" font-size="22" font-weight="700" fill="#238456" text-anchor="end">48 × 30 × 20 см</text>
<line x1="82" y1="1369" x2="1518" y2="1369" stroke="#e0e5e9" stroke-width="1"/>
<text x="82" y="1408" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">Комплектность</text>
<text x="839" y="1408" font-size="22" font-weight="400" fill="#b63740" text-anchor="start">—</text>
<text x="1518" y="1408" font-size="22" font-weight="700" fill="#238456" text-anchor="end">рюкзак; чехла нет</text>
<line x1="82" y1="1424" x2="1518" y2="1424" stroke="#e0e5e9" stroke-width="1"/>
<text x="82" y="1473" font-size="20" font-weight="400" fill="#687580" text-anchor="start">Текст не обещает водонепроницаемость и не показывает чехол как часть комплекта.</text>
<rect x="54" y="1517" width="1492" height="560" rx="13" fill="#ffffff" stroke="#cfd6db" stroke-width="2"/>
<text x="82" y="1565" font-size="19" font-weight="700" fill="#b63740" text-anchor="start" letter-spacing="2">03</text>
<text x="135" y="1565" font-size="29" font-weight="700" fill="#20262d" text-anchor="start">Сценарий пяти кадров для галереи</text>
<rect x="82" y="1610" width="1436" height="72" rx="7" fill="#f7f8f9" stroke="#e0e5e9" stroke-width="2"/>
<text x="105" y="1656" font-size="21" font-weight="700" fill="#b63740" text-anchor="start">01</text>
<text x="183" y="1656" font-size="23" font-weight="700" fill="#20262d" text-anchor="start">Главное фото</text>
<text x="520" y="1656" font-size="21" font-weight="400" fill="#687580" text-anchor="start">Рюкзак целиком на нейтральном фоне; без чужих аксессуаров.</text>
<rect x="82" y="1693" width="1436" height="72" rx="7" fill="#f7f8f9" stroke="#e0e5e9" stroke-width="2"/>
<text x="105" y="1739" font-size="21" font-weight="700" fill="#b63740" text-anchor="start">02</text>
<text x="183" y="1739" font-size="23" font-weight="700" fill="#20262d" text-anchor="start">Габариты</text>
<text x="520" y="1739" font-size="21" font-weight="400" fill="#687580" text-anchor="start">48 × 30 × 20 см и масса 0,8 кг рядом с товаром.</text>
<rect x="82" y="1776" width="1436" height="72" rx="7" fill="#f7f8f9" stroke="#e0e5e9" stroke-width="2"/>
<text x="105" y="1822" font-size="21" font-weight="700" fill="#b63740" text-anchor="start">03</text>
<text x="183" y="1822" font-size="23" font-weight="700" fill="#20262d" text-anchor="start">Хранение</text>
<text x="520" y="1822" font-size="21" font-weight="400" fill="#687580" text-anchor="start">Показать два основных отделения и два боковых кармана.</text>
<rect x="82" y="1859" width="1436" height="72" rx="7" fill="#f7f8f9" stroke="#e0e5e9" stroke-width="2"/>
<text x="105" y="1905" font-size="21" font-weight="700" fill="#b63740" text-anchor="start">04</text>
<text x="183" y="1905" font-size="23" font-weight="700" fill="#20262d" text-anchor="start">Посадка</text>
<text x="520" y="1905" font-size="21" font-weight="400" fill="#687580" text-anchor="start">Показать регулируемые лямки и рюкзак на человеке.</text>
<rect x="82" y="1942" width="1436" height="72" rx="7" fill="#f7f8f9" stroke="#e0e5e9" stroke-width="2"/>
<text x="105" y="1988" font-size="21" font-weight="700" fill="#b63740" text-anchor="start">05</text>
<text x="183" y="1988" font-size="23" font-weight="700" fill="#20262d" text-anchor="start">Комплект</text>
<text x="520" y="1988" font-size="21" font-weight="400" fill="#687580" text-anchor="start">Показать только рюкзак; отдельно указать отсутствие чехла.</text>
<rect x="54" y="2099" width="1492" height="326" rx="13" fill="#ffffff" stroke="#cfd6db" stroke-width="2"/>
<text x="82" y="2147" font-size="19" font-weight="700" fill="#b63740" text-anchor="start" letter-spacing="2">04</text>
<text x="135" y="2147" font-size="29" font-weight="700" fill="#20262d" text-anchor="start">Описание и контроль перед публикацией</text>
<text x="82" y="2202" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">35 л для поездок и походов. Два основных отделения помогают разделить вещи,</text>
<text x="82" y="2238" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">боковые карманы держат мелочи под рукой. Полиэстер 600D; масса 0,8 кг.</text>
<text x="82" y="2274" font-size="22" font-weight="400" fill="#20262d" text-anchor="start">Размеры 48 × 30 × 20 см. Дождевой чехол в комплект не входит.</text>
<line x1="82" y1="2300" x2="1518" y2="2300" stroke="#e0e5e9" stroke-width="1"/>
<text x="82" y="2350" font-size="21" font-weight="700" fill="#238456" text-anchor="start">Передать на согласование: паспорт SKU · три поля · пять заданий для галереи.</text>
<text x="54" y="2450" font-size="18" font-weight="400" fill="#687580" text-anchor="start">Источники: паспорт SKU и текущая карточка. Публикация — после проверки владельцем товара.</text>
