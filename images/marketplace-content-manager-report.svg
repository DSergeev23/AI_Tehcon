<text x="82" y="1186" font-size="25" font-weight="700" fill="#20262d" text-anchor="start">Рюкзак туристический 35 л, полиэстер 600D, 48 × 30 × 20 см</text>
<text x="82" y="1234" font-size="18" font-weight="700" fill="#687580" text-anchor="start">АТРИБУТ</text>
<text x="839" y="1234" font-size="18" font-weight="700" fill="#687580" text-anchor="start">БЫЛО</text>
<text x="1518" y="1234" font-size="18" font-weight="700" fill="#687580" text-anchor="end">К ПУБЛИКАЦИИ</text>
