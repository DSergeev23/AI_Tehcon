<text x="82" y="933" font-size="19" font-weight="700" fill="#b63740" text-anchor="start" letter-spacing="2">02</text>
<text x="135" y="933" font-size="29" font-weight="700" fill="#20262d" text-anchor="start">Из разрозненных полей — в понятную карточку</text>
<text x="82" y="979" font-size="18" font-weight="700" fill="#687580" text-anchor="start" letter-spacing="1">БЫЛО</text>
<text x="82" y="1025" font-size="25" font-weight="400" fill="#20262d" text-anchor="start">Рюкзак туристический для путешествий</text>
<text x="82" y="1063" font-size="22" font-weight="400" fill="#687580" text-anchor="start">Вес, размеры и комплектность не заполнены.</text>
