<text x="102" y="734" font-size="21" font-weight="400" fill="#687580" text-anchor="start">Лямки</text>
<text x="757" y="734" font-size="22" font-weight="700" fill="#20262d" text-anchor="end">регулируемые</text>
<rect x="806" y="698" width="696" height="56" rx="6" fill="#f7f8f9" stroke="#e0e5e9" stroke-width="2"/>
<text x="826" y="734" font-size="21" font-weight="400" fill="#687580" text-anchor="start">Дождевой чехол</text>
<text x="1481" y="734" font-size="22" font-weight="700" fill="#20262d" text-anchor="end">не входит в комплект</text>
<rect x="82" y="777" width="1436" height="60" rx="7" fill="#fff6f4" stroke="#e5c9c7" stroke-width="2"/>
<text x="103" y="814" font-size="22" font-weight="700" fill="#b63740" text-anchor="start">НЕ ПОДТВЕРЖДЕНО: «полностью водонепроницаемый», «чехол в комплекте»</text>
