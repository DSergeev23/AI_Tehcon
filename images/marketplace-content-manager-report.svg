<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2480" viewBox="0 0 1600 2480" role="img" aria-labelledby="title description">
<title id="title">Карточка рюкзака: факты → публикация</title>
<desc id="description">Редакционный пакет для туристического рюкзака 35 л: паспорт SKU, пропуски карточки, заголовок, атрибуты, описание, план пяти кадров и исключённые обещания.</desc>
