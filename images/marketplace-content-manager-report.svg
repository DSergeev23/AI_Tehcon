<text x="102" y="604" font-size="21" font-weight="400" fill="#687580" text-anchor="start">Размеры</text>
<text x="757" y="604" font-size="22" font-weight="700" fill="#20262d" text-anchor="end">48 × 30 × 20 см</text>
<rect x="806" y="568" width="696" height="56" rx="6" fill="#f7f8f9" stroke="#e0e5e9" stroke-width="2"/>
