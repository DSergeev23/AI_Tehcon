name: Publish static site to Timeweb App Platform

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-platform-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code
        run: |
          npm run lint
          npm run typecheck

      - name: Build site
        run: npm run build

      - name: Check and prepare static files
        run: |
          test -f dist/index.html
          rm -f dist/api/contact.php dist/.htaccess

      - name: Set up PHP for news generation
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl

      - name: Include current news in the static site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          export NEWS_PUBLIC_ROOT="$GITHUB_WORKSPACE/dist"
          export NEWS_STATE_FILE="$RUNNER_TEMP/news-managed-slugs.json"
          php -l scripts/timeweb/sync-news.php
          php scripts/timeweb/sync-news.php --self-test
          php scripts/timeweb/sync-news.php scripts/timeweb/news-sync.config.github.php
          test -s dist/news/index.html
          test -s dist/data/news/news.json
          test -s dist/news-sitemap.xml

      - name: Publish built files to app-platform branch
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh auth setup-git

          publish_dir="${RUNNER_TEMP}/app-platform"
          git init -q -b app-platform "$publish_dir"
          git -C "$publish_dir" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if git -C "$publish_dir" ls-remote --exit-code \
            --heads origin app-platform >/dev/null; then
            git -C "$publish_dir" fetch --depth=1 origin app-platform
            git -C "$publish_dir" switch -C app-platform FETCH_HEAD
          fi

          rsync -a --delete --exclude='.git/' dist/ "$publish_dir/"
          git -C "$publish_dir" add -A

          if ! git -C "$publish_dir" diff --cached --quiet; then
            git -C "$publish_dir" commit \
              -m "Publish static site from ${GITHUB_SHA}"
            git -C "$publish_dir" push origin HEAD:refs/heads/app-platform
          fi

          echo "sha=$(git -C "$publish_dir" rev-parse HEAD)" \
            >> "$GITHUB_OUTPUT"

      - name: Start Timeweb deployment
        if: ${{ vars.TIMEWEB_APP_ID != '' }}
        env:
          TIMEWEB_APP_ID: ${{ vars.TIMEWEB_APP_ID }}
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          DEPLOY_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$TIMEWEB_CLOUD_TOKEN"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${TIMEWEB_CLOUD_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"commit_sha\":\"${DEPLOY_SHA}\"}" \
            "https://api.timeweb.cloud/api/v1/apps/${TIMEWEB_APP_ID}/deploy"
