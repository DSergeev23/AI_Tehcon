name: Build and deploy to Timeweb from artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build production artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Timeweb news sync
        run: |
          php -l scripts/timeweb/sync-news.php
          php scripts/timeweb/sync-news.php --self-test

      - name: Build
        run: npm run build

      - name: Pack dist
        run: |
          tar \
            -czf "$RUNNER_TEMP/ai-tehcon-dist.tar.gz" \
            -C dist .

          tar -tzf "$RUNNER_TEMP/ai-tehcon-dist.tar.gz" | grep -qx './news/index.html'
          tar -tzf "$RUNNER_TEMP/ai-tehcon-dist.tar.gz" | grep -qx './data/news/news.json'
          tar -tzf "$RUNNER_TEMP/ai-tehcon-dist.tar.gz" | grep -qx './news-sitemap.xml'

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-tehcon-dist
          path: ${{ runner.temp }}/ai-tehcon-dist.tar.gz
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  deploy:
    name: Deploy existing artifact via SSH
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate SSH configuration
        env:
          SSH_PASSWORD: ${{ secrets.TIMEWEB_SSH_PASSWORD }}
        run: |
          : "${SSH_PASSWORD:?TIMEWEB_SSH_PASSWORD is not set}"

      - name: Download production artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-tehcon-dist
          path: ${{ runner.temp }}/deploy-artifact

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Upload and extract archive on Timeweb
        timeout-minutes: 15
        env:
          SSH_HOST: ${{ vars.TIMEWEB_SSH_HOST || '92.53.96.50' }}
          SSH_PORT: ${{ vars.TIMEWEB_SSH_PORT || '22' }}
          SSH_USERNAME: ct71002
          SSHPASS: ${{ secrets.TIMEWEB_SSH_PASSWORD }}
          DEPLOY_PATH: /home/c/ct71002/ai-tehcon.ru/public_html
        run: |
          : "${SSH_HOST:?SSH_HOST is not set}"
          : "${SSH_PORT:?SSH_PORT is not set}"
          : "${SSH_USERNAME:?SSH_USERNAME is not set}"
          : "${SSHPASS:?TIMEWEB_SSH_PASSWORD is not set}"
          : "${DEPLOY_PATH:?DEPLOY_PATH is not set}"

          local_archive="$RUNNER_TEMP/deploy-artifact/ai-tehcon-dist.tar.gz"
          remote_archive="/home/c/ct71002/ai-tehcon-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          known_hosts_file="$RUNNER_TEMP/timeweb-known-hosts"
          deploy_succeeded=false
          retry_limit=5

          test -f "$local_archive"

          ssh_options=(
            -4
            -o ConnectTimeout=20
            -o ConnectionAttempts=1
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
            -o StrictHostKeyChecking=accept-new
            -o "UserKnownHostsFile=${known_hosts_file}"
          )

          for attempt in $(seq 1 "$retry_limit"); do
            echo "SSH deployment attempt ${attempt} of ${retry_limit}"

            remote_command="
              set -eu
              deploy_path='${DEPLOY_PATH}'
              archive_path='${remote_archive}'
              mkdir -p \"\$deploy_path\"
              set --

              if [ -f \"\$deploy_path/news/index.html\" ] && grep -q 'data-news-generated=\"true\"' \"\$deploy_path/news/index.html\"; then
                set -- \"\$@\" --exclude='./news'
              fi
              if [ -f \"\$deploy_path/data/news/news.json\" ] && ! grep -q '\"generatedAt\": null' \"\$deploy_path/data/news/news.json\"; then
                set -- \"\$@\" --exclude='./data/news/news.json'
              fi
              if [ -f \"\$deploy_path/news-sitemap.xml\" ] && ! grep -q 'news-sitemap-bootstrap' \"\$deploy_path/news-sitemap.xml\"; then
                set -- \"\$@\" --exclude='./news-sitemap.xml'
              fi

              tar \"\$@\" -xzf \"\$archive_path\" -C \"\$deploy_path\"
              rm -f \"\$archive_path\"
            "

            if sshpass -e scp -P "$SSH_PORT" "${ssh_options[@]}" \
              "$local_archive" "${SSH_USERNAME}@${SSH_HOST}:${remote_archive}" && \
              sshpass -e ssh -p "$SSH_PORT" "${ssh_options[@]}" \
              "${SSH_USERNAME}@${SSH_HOST}" "$remote_command"; then
              deploy_succeeded=true
              echo "SSH deployment completed on attempt ${attempt}"
              break
            fi

            if [ "$attempt" -lt "$retry_limit" ]; then
              pause_seconds=$((attempt * 20))
              echo "SSH deployment failed. Retrying in ${pause_seconds} seconds..."
              sleep "$pause_seconds"
            fi
          done

          if [ "$deploy_succeeded" != "true" ]; then
            echo "SSH deployment failed after ${retry_limit} attempts."
            exit 1
          fi
