name: Deploy to Timeweb

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Check FTP connection
        timeout-minutes: 2
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          : "${FTP_HOST:?FTP_HOST is not set}"
          : "${FTP_USERNAME:?FTP_USERNAME is not set}"
          : "${FTP_PASSWORD:?FTP_PASSWORD is not set}"

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" -e "
            set cmd:fail-exit true;
            set ftp:ssl-allow false;
            set ftp:passive-mode true;
            set net:timeout 20;
            set net:max-retries 1;
            set net:reconnect-interval-base 5;
            cd public_html;
            pwd;
            bye
          "

      - name: Upload dist to Timeweb
        timeout-minutes: 20
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          : "${FTP_HOST:?FTP_HOST is not set}"
          : "${FTP_USERNAME:?FTP_USERNAME is not set}"
          : "${FTP_PASSWORD:?FTP_PASSWORD is not set}"

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" -e "
            set cmd:fail-exit true;
            set ftp:ssl-allow false;
            set ftp:passive-mode true;
            set net:timeout 20;
            set net:max-retries 2;
            set net:reconnect-interval-base 5;
            mirror -R --verbose --continue --parallel=4 dist/ public_html/;
            bye
          "
